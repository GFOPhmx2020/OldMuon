<!doctype html><html lang="zh"><meta charset="utf-8"><title>立方体核产生密度</title>
<style>body{margin:0;background:#f3f6fa;color:#18324a;font:15px system-ui}header{padding:18px 24px;background:white}h2{margin:0 0 10px}label{margin-right:16px;display:inline-block;padding:5px}select,button{padding:6px;border:1px solid #becbd8;border-radius:5px;background:white}canvas{display:block;width:100%;height:70vh;touch-action:none}#tip{position:fixed;display:none;background:#fffef4;padding:10px;border:1px solid #abc;pointer-events:none;white-space:pre-line}footer{padding:12px 24px}#legend{display:inline-block;width:180px;height:12px;background:linear-gradient(to right,#d7eaf4,#1d72a3,#07304f)}</style>
<header><h2 id="title"></h2><label>元素 <select id="element"><option value="all">全部元素</option></select></label>
<label>统计口径 <select id="mode"><option value="0">全部产生核</option><option value="1">hadElastic 弹性产生核</option></select></label>
<label><input type="checkbox" id="log" checked>对数颜色</label><label>密度下限 <input id="cut" type="range" min="0" max="100" value="0"> <span id="cutText"></span></label>
<label>视角 <button id="reset">重置</button></label><div id="stats"></div></header>
<canvas id="view"></canvas><div id="tip"></div>
<footer><span id="legend"></span> <span id="scale"></span><p>左键拖动旋转；右键拖动或 Shift＋左键拖动平移（中键也可） · 滚轮缩放 · 悬停查看数值。每个点代表一个立方体体素的中心，颜色为该体素核数/实际体积（N/m³），不是单个核的位置。空体素隐藏。保持立方体真实长宽比例。</p><p>z 是几何坐标，向下深度 d=L/2−z。统计为本次模拟累计数，不是每秒产生率。hadElastic 可筛选弹性过程，但不区分母粒子种类。</p></footer>
<script>
// 平移量以屏幕像素保存：旋转不改变中心偏移，线框和数据共用。
let panX=0,panY=0;

const D=/*DATA*/null;
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
const symbols=['','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'];
$('title').textContent=D.material+'：立方体体素核产生密度';
Object.keys(D.groups).sort((a,b)=>+a-+b).forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent='Z'+z+' '+(symbols[+z]||'');$('element').append(o)});
let az=.55,tilt=.25,zoom=1,points=[],visible=[],max=1,selectedCount=0,drag=null;
function rebuild(){const counts={};const keys=$('element').value==='all'?Object.keys(D.groups):[$('element').value];for(const k of keys)for(const [i,n] of Object.entries(D.groups[k][+$('mode').value]))counts[i]=(counts[i]||0)+n;
points=[];selectedCount=0;max=0;
for(const [key,n] of Object.entries(counts)){const i=+key,ir=i%D.nr,ip=Math.floor(i/D.nr)%D.nphi,iz=Math.floor(i/(D.nr*D.nphi));
const r0=-D.radius+ir*D.length/D.nr,r1=r0+D.length/D.nr,y=-D.radius+(ip+.5)*D.length/D.nphi,z0=-D.length/2+iz*D.length/D.nz;
points.push({x:(r0+r1)/2,y:y,z:z0+D.length/(2*D.nz),n,d:n/D.volume,ir,ip,iz,r0,r1,z0});selectedCount+=n;max=Math.max(max,n/D.volume)}
$('stats').textContent=`入射事件 ${D.events}；当前口径核数 ${selectedCount.toLocaleString()}；分箱 ${D.nr}×${D.nphi}×${D.nz}；每格 ${D.volume.toPrecision(5)} m³`;
draw();}
function project(x,y,z){const u=Math.cos(az)*x-Math.sin(az)*y,v=Math.sin(az)*x+Math.cos(az)*y;
const height=Math.cos(tilt)*z-Math.sin(tilt)*v,depth=Math.sin(tilt)*z+Math.cos(tilt)*v;
const s=Math.min(canvas.width,canvas.height)*.78/Math.max(D.length,2*D.radius)*zoom;
return [canvas.width/2+panX+u*s,canvas.height/2+panY-height*s,depth];}
function draw(){const box=canvas.getBoundingClientRect();canvas.width=Math.round(box.width);canvas.height=Math.round(box.height);ctx.clearRect(0,0,canvas.width,canvas.height);visible=[];
const cutoff=max*(+$('cut').value)/100;$('cutText').textContent=cutoff.toPrecision(3)+' N/m³';
$('scale').textContent=($('log').checked?'log(1+ρ) 色标':'线性色标')+'：0 — '+max.toPrecision(5)+' N/m³';
for(const p of points)if(p.d>=cutoff){const a=project(p.x,p.y,p.z);visible.push({...p,sx:a[0],sy:a[1],depth:a[2]})}visible.sort((a,b)=>a.depth-b.depth);
for(const p of visible){const t=max===0?0:($('log').checked?Math.log1p(p.d)/Math.log1p(max):p.d/max);ctx.fillStyle=`rgb(${Math.round(215-208*t)},${Math.round(234-186*t)},${Math.round(244-165*t)})`;ctx.beginPath();ctx.arc(p.sx,p.sy,Math.max(2,Math.min(6,3*zoom)),0,2*Math.PI);ctx.fill();}
// 真实立方体边界，顶底圆与侧面母线用于提供空间参照。
ctx.strokeStyle='#617d94';ctx.lineWidth=1;
const h=D.length/2;
for(let axis=0;axis<3;axis++)for(const a of [-h,h])for(const b of [-h,h]){const v=[0,0,0],w=[0,0,0];v[axis]=-h;w[axis]=h;v[(axis+1)%3]=w[(axis+1)%3]=a;v[(axis+2)%3]=w[(axis+2)%3]=b;const p=project(...v),q=project(...w);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()}
ctx.fillStyle='#193c57';ctx.font='14px sans-serif';for(const [z,label] of [[D.length/2,'顶面：z=+'+D.length/2+' m'],[-D.length/2,'底面：z=−'+D.length/2+' m']]){const p=project(0,0,z);ctx.fillText(label,p[0]+12,p[1]-10)}
for(const [v,label] of [[[D.radius*1.3,0,0],'X'],[[0,D.radius*1.3,0],'Y']]){let p=project(...v);ctx.fillText(label,p[0],p[1])}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);$('tip').style.display='none'};
canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.onpointermove=e=>{if(drag){az+=(e.clientX-drag[0])*.008;tilt=Math.max(-1.5,Math.min(1.5,tilt+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();return}
const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let hit=null,best=64;for(const p of visible){const dist=(p.sx-x)**2+(p.sy-y)**2;if(dist<best){best=dist;hit=p}}
const tip=$('tip');if(!hit){tip.style.display='none';return}tip.textContent=`体素 (x,y,z) = (${hit.ir},${hit.ip},${hit.iz})\nx: ${hit.r0.toFixed(3)}–${hit.r1.toFixed(3)} m\nz: ${hit.z0.toFixed(2)}–${(hit.z0+D.length/D.nz).toFixed(2)} m\nN=${hit.n}；V=${D.volume.toPrecision(6)} m³\nρ=${hit.d.toPrecision(6)} N/m³`;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-300)+'px';tip.style.top=Math.max(0,e.clientY-130)+'px'};
canvas.onpointerleave=()=>$('tip').style.display='none';canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
$('element').onchange=rebuild;$('mode').onchange=rebuild;$('log').onchange=draw;$('cut').oninput=draw;$('reset').onclick=()=>{panX=0;panY=0;az=.55;tilt=.25;zoom=1;draw()};window.onresize=draw;rebuild();

// 捕获阶段接管平移手势，避免同时触发原来的旋转/悬停处理。
let panDrag=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
 if(e.button===2||e.button===1||(e.button===0&&e.shiftKey)){
  e.preventDefault();e.stopImmediatePropagation();
  panDrag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);
  const tip=document.getElementById('tip');if(tip)tip.style.display='none';
 }
},true);
canvas.addEventListener('pointermove',e=>{
 if(!panDrag)return;e.preventDefault();e.stopImmediatePropagation();
 panX+=e.clientX-panDrag[0];panY+=e.clientY-panDrag[1];
 panDrag=[e.clientX,e.clientY];draw();
},true);
for(const type of ['pointerup','pointercancel'])canvas.addEventListener(type,e=>{
 if(!panDrag)return;e.stopImmediatePropagation();panDrag=null;
 if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
},true);

</script></html>
